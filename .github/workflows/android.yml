name: Build FINAL116 Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Install Buildozer toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.6.0" "cython==0.29.34" "setuptools<81"

      - name: Verify project and Android pins
        run: |
          test -f buildozer.spec
          test -f Archery_Coach_TSV_Holm_PRO_FINAL116_MOBILE.py
          python -m py_compile Archery_Coach_TSV_Holm_PRO_FINAL116_MOBILE.py
          echo '--- buildozer.spec ---'
          cat buildozer.spec
          echo '--- Python/Kivy pins ---'
          grep -nE "requirements|p4a.python_version|android.api|android.minapi|android.ndk|android.ndk_api|android.archs" buildozer.spec

      - name: Clean previous build state
        run: rm -rf .buildozer bin

      - name: Build APK
        run: buildozer -v android debug

      - name: List APK
        run: ls -lah bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TSV-Holm-FINAL116-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
