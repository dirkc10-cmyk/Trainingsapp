name: Build FINAL116 Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.6.0" "cython<3.0"

      - name: Verify project
        run: |
          test -f buildozer.spec
          test -f Archery_Coach_TSV_Holm_PRO_FINAL116_MOBILE.py
          python -m py_compile Archery_Coach_TSV_Holm_PRO_FINAL116_MOBILE.py
          grep -nE "android.minapi|android.ndk_api|android.ndk|p4a.python_version|android.accept_sdk_license" buildozer.spec

      - name: Build APK
        run: |
          rm -rf .buildozer bin
          buildozer android debug

      - name: List APK
        run: |
          ls -lah bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TSV-Holm-FINAL116-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error
